<!-- register.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar Admin Baru</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .reg-box { max-width: 400px; margin: 50px auto; padding: 25px; background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .step-info { font-size: 0.9em; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="reg-box" id="step-1">
    <h2>Daftar Akun Admin</h2>
    <p class="step-info">Langkah 1: Isi data akun Anda</p>
    <input type="text" id="reg-username" placeholder="Username (Nama Lengkap)" required>
    <input type="email" id="reg-email" placeholder="Email Admin" required>
    <input type="password" id="reg-password" placeholder="Password (Min. 6 Karakter)" required>
    <button id="btn-send-otp">Kirim Kode OTP</button>
</div>

<div class="reg-box hidden" id="step-2">
    <h2>Verifikasi Email</h2>
    <p class="step-info">Langkah 2: Masukkan 6 digit kode yang dikirim ke email Anda</p>
    <input type="number" id="otp-input" placeholder="Masukkan Kode OTP" required>
    <button id="btn-verify">Verifikasi & Buat Akun</button>
    <button id="btn-back" style="background: #ccc; margin-top: 5px;">Kembali</button>
</div>

<!-- Load Library EmailJS -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="module" src="register.js"></script>
</body>
</html>
